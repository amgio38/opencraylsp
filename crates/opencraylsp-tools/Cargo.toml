[package]
name = "opencraylsp-tools"
description = "The lsp_* tool catalog: argument schemas, symbol resolution and model-facing output formatting."
publish = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
readme.workspace       = true
keywords.workspace     = true
categories.workspace   = true

[dependencies]
opencraylsp-proto = { workspace = true }
opencraylsp-core  = { workspace = true }
lsp-types         = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
tokio             = { workspace = true }
tokio-util        = { workspace = true }
tracing           = { workspace = true }
url               = { workspace = true }
similar           = { workspace = true }

[dev-dependencies]
async-trait      = { workspace = true }
opencraylsp-core = { workspace = true, features = ["testing"] }
tempfile         = { workspace = true }

[lints]
workspace = true
